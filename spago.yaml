workspace:
  extraPackages:
    sigil:
      path: /Users/afc/work/afc-work/purescript-hylograph-libs/purescript-sigil

package:
  name: hylograph-halogen-ui
  description: Reusable Halogen UI widgets on a single uniform, controlled
    component contract — disclosure/accordion, and (to come) modal, dropdown,
    tab-bar, slider. Every widget follows the same Input/Output/Query/receive
    rail so new ones are predictable to author and safe to delegate.
  publish:
    version: 0.1.0
    license: MIT
    location:
      githubOwner: afcondon
      githubRepo: purescript-hylograph-halogen-ui
  dependencies:
    - aff: ">=7.1.0 <8.0.0"
    - arrays: ">=7.3.0 <8.0.0"
    - datetime: ">=6.1.0 <7.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - halogen: ">=7.0.0 <8.0.0"
    - halogen-subscriptions: ">=2.0.0 <3.0.0"
    - integers: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - numbers: ">=9.0.1 <10.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - unsafe-coerce: ">=6.0.0 <7.0.0"
    - web-dom: ">=6.0.0 <7.0.0"
    - web-events: ">=4.0.0 <5.0.0"
    - web-html: ">=4.1.1 <5.0.0"
    - web-uievents: ">=4.1.0 <5.0.0"
  test:
    main: Test.Main
    dependencies: []
